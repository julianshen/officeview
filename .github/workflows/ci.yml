# Continuous integration for officeview.
#
# NOTE ON GOLDENS (please read before "fixing" this file by adding a golden
# step): scripts/golden-corpus.ts compare and scripts/golden.ts compare are
# deliberately NOT run here. The goldens are pixel-exact PNGs recorded on a
# developer Mac; font rasterization differs between macOS and the Linux CI
# runner, so every golden would fail for reasons unrelated to the code.
# This exclusion is enforced at RUN time, not just by omitting a step: the
# test step below fetches the corpus first (so corpus-regressions.test.ts
# actually runs) and then invokes vitest with the pixel-golden suites
# excluded. Do NOT "simplify" it back to `bun run test` — that would
# re-enable tests/golden.test.ts and tests/golden-corpus.test.ts on Linux
# and turn the suite red for font reasons. The machine-independent coverage
# is the corpus report at the end: it asserts that real documents parse and
# actually paint their text, never that pixels match. Run the golden compare
# locally, on the machine that recorded them:
#   bun scripts/golden-corpus.ts compare

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch cancel; only the latest commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, media, build, corpus
    runs-on: ubuntu-latest
    # The vitest suite runs in the sharded `test` job below; this job keeps everything else (~8 min).
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install system libraries for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Set up bun (pinned, do not float)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Restore bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      # The root include set excludes server/: its sources and tests get their own check.
      - name: Typecheck the stream server
        run: bun run typecheck:server

      # Piece 5 (plan D5/D6): the stream server's sandboxed ffmpeg. The media tests run with
      # OV_MEDIA_REQUIRED=1, so a missing or failing probe (version < 6, codec, demuxer, sandbox) fails
      # the job instead of skipping. The sysctl lets `unshare --user --net` work on ubuntu-24.04.
      - name: Install ffmpeg for the stream server media tests
        run: |
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Allow unprivileged user namespaces (unshare --user --net)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Before the media tests and the suite: the media wire audit opens corpus decks, and
      # corpus-regressions.test.ts runs instead of skipping.
      - name: Fetch the real-file corpus
        run: bun scripts/fetch-corpus.ts

      - name: Stream server media tests (sandboxed ffmpeg, required)
        run: cd server && OV_MEDIA_REQUIRED=1 bun test test/media

      - name: Build the library
        run: bun run build

      - name: Corpus report (fails on degraded or unexpected failures)
        run: bun scripts/corpus-report.ts

  # The vitest suite, split across three runners (PR #89: one runner took 30 min of a 45-min job, about
  # 2670 s of per-file time; the CF oracle file alone is ~330 s). `--shard` splits by file, so each
  # shard runs roughly a third of the files. Pixel-golden suites stay excluded (see the note above).
  test:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install system libraries for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      # tests/slideshow-capture-export.test.ts runs its ffmpeg integration test only when ffmpeg + libx264
      # are present; the single-job suite ran after the ffmpeg install, so every shard keeps it.
      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Set up bun (pinned, do not float)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Restore bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # corpus-regressions.test.ts runs instead of skipping only when the corpus is present.
      - name: Fetch the real-file corpus
        run: bun scripts/fetch-corpus.ts

      - name: Run the test suite shard (pixel-golden suites excluded — see note above)
        run: bunx vitest run --exclude 'tests/golden*.test.ts' --shard=${{ matrix.shard }}/3

  # Slideshow plan S1-2 (blocking): the `slideshow` Playwright project only,
  # never the whole browser suite. It proves headless Chromium creates a
  # WebGL2 context through SwiftShader and enters element full screen. If
  # WebGL2 cannot be created here, the job fails and the stage PR is blocked
  # and escalated to the owner; there is no Canvas-2D-only CI path.
  slideshow-browser:
    name: slideshow browser smoke (Chromium, SwiftShader WebGL2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install system libraries for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Set up bun (pinned, do not float)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Restore bun dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium and its system dependencies
        run: bunx playwright install --with-deps chromium

      # Slideshow plan S1-22: slideshow-corpus.spec.ts presents every LibreOffice
      # corpus deck on the WebGL2 (SwiftShader) and forced Canvas 2D paths and
      # checks that the frame-benchmark recorder runs on WebGL2. In CI a missing
      # corpus fails that spec rather than skipping it.
      - name: Fetch the real-file corpus
        run: bun scripts/fetch-corpus.ts

      - name: Slideshow Playwright project
        env:
          IV_HARNESS_PORT: '4311'
        run: bunx playwright test --config playwright.viewer.config.ts --project slideshow
